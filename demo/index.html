<!DOCTYPE html>
<meta charset="utf-8">
<title>hackpi kb render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { width: 740px; height: 1080px; display: block; }
  video { display: none; }
  @font-face { font-family: "Nunito"; font-weight: 700; src: url("/fonts/nunito-700.woff2") format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("/fonts/nunito-800.woff2") format("woff2"); }
</style>
<canvas id="c" width="740" height="1080"></canvas>
<video id="vid" src="/hackpi-overlay.mp4" muted playsinline preload="auto"></video>
<script src="/three.min.js"></script>
<script>
const W = 740, H = 1080;

// shortcut timeline synced with hackpi-overlay.mp4
const EVENTS = [
  { t: 2.0,  dur: 2.2, keys: ["super", "P"] },
  { t: 4.5,  dur: 2.2, keys: ["super", "P"] },
  { t: 7.5,  dur: 2.2, keys: ["super", "K"] },
  { t: 10.0, dur: 2.2, keys: ["super", "J"] },
  { t: 13.0, dur: 2.2, keys: ["super", "O"] },
  { t: 15.5, dur: 2.2, keys: ["super", "O"] },
  { t: 18.0, dur: 2.2, keys: ["super", "I"] },
  { t: 21.0, dur: 3.0, keys: ["super", "V"] },
  { t: 25.0, dur: 3.0, keys: ["super", "D"] },
  { t: 29.0, dur: 3.0, keys: ["super", "space"] },
];

// Hackberry Q10: official keymap + photo alt legends, BB-style uppercase glyphs
const ROWS = [
  { type: "media" },
  { ids: [["#","Q"],["1","W"],["2","E"],["3","R"],["(","T"],[")","Y"],["_","U"],["-","I"],["+","O"],["@","P"]] },
  { ids: [["*","A"],["4","S"],["5","D"],["6","F"],["/","G"],[":","H"],[";","J"],["'","K"],["\"","L"],["del","bspc"]] },
  { ids: [["\u21E7","shift"],["7","Z"],["8","X"],["9","C"],["?","V"],["!","B"],[",","N"],[".","M"],["\uD83D\uDD0A","dollar"],[null,"enter"]] },
  { ids: [["\u2b1f","ctrl"],["0","altw"],[null,"space"],["sym","layer1"],["\u260e","layer2"]] },
];

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 6000);
function frameCam(bb, border) {
  const hgt = bb.max.y - bb.min.y;
  const half = hgt / (2 * (1 - border));
  cam.position.set(0, (bb.min.y + bb.max.y) / 2, half / Math.tan((cam.fov * Math.PI / 180) / 2));
  cam.lookAt(0, (bb.min.y + bb.max.y) / 2, 0);
}

scene.add(new THREE.AmbientLight(0x46506e, 1.0));
const keyL = new THREE.DirectionalLight(0xdde2f4, 1.05);
keyL.position.set(-200, 300, 420); scene.add(keyL);
const rim = new THREE.DirectionalLight(0x5b7bd8, 0.55);
rim.position.set(220, -100, 220); scene.add(rim);
const spot = new THREE.PointLight(0xffb24a, 0, 1200, 1.5);
spot.position.set(0, -260, 320); scene.add(spot);

// plain black background
(function () {
  const cv = document.createElement("canvas"); cv.width = cv.height = 16;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 16, 16);
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(6600, 6600),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) }));
  bg.position.z = -2200; scene.add(bg);
})();

function parseSTL(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(80, true);
  const pos = [];
  for (let i = 0; i < n; i++) {
    const off = 84 + i * 50 + 12;
    for (let v = 0; v < 3; v++)
      pos.push(dv.getFloat32(off + v*12, true), dv.getFloat32(off + v*12+4, true), dv.getFloat32(off + v*12+8, true));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
const loadSTL = (u) => fetch(u).then(r => r.arrayBuffer()).then(parseSTL);
function boxFor(g) { g.computeBoundingBox(); return g.boundingBox; }

const keycaps = {};
const capGeoCache = {};
const DEPTH = 3.8, BEVEL = 1.1;
function capGeo(bw, bh, r) {
  const kk = bw.toFixed(2) + "_" + bh.toFixed(2);
  if (capGeoCache[kk]) return capGeoCache[kk];
  const shape = new THREE.Shape();
  const hw = bw / 2, hh = bh / 2;
  shape.moveTo(-hw + r, -hh);
  shape.lineTo(hw - r, -hh);
  shape.quadraticCurveTo(hw, -hh, hw, -hh + r);
  shape.lineTo(hw, hh - r);
  shape.quadraticCurveTo(hw, hh, hw - r, hh);
  shape.lineTo(-hw + r, hh);
  shape.quadraticCurveTo(-hw, hh, -hw, hh - r);
  shape.lineTo(-hw, -hh + r);
  shape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: DEPTH, bevelEnabled: true,
    bevelThickness: 0.9, bevelSize: 0.55, bevelSegments: 2, curveSegments: 6 });
  capGeoCache[kk] = geo;
  return geo;
}
const HANGUP = "\uE000"; // private-use token: end-call handset + power over Tab
function drawHangup(ctx, cx, cy) {
  // end-call handset (rotated receiver) ...
  ctx.save();
  ctx.translate(cx, cy + 8);
  ctx.rotate(Math.PI * 0.75);
  ctx.font = "76px DejaVu Sans, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("\u260E", 0, 0);
  ctx.restore();
  // ... with BB power mark above it
  ctx.save();
  ctx.translate(cx + 44, cy - 44);
  ctx.strokeStyle = "#e7eaf6"; ctx.lineWidth = 11; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(0, 6, 24, -Math.PI * 0.35, Math.PI * 1.35);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(0, 6);
  ctx.stroke();
  ctx.restore();
}
// BB send icon: curved receiver, earpiece top-left to mouthpiece bottom-right
function drawSend(ctx, cx, cy) {
  ctx.save();
  ctx.strokeStyle = "#e7eaf6"; ctx.lineWidth = 38; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(cx + 20, cy - 10, 74, Math.PI * 0.3, Math.PI * 1.3);
  ctx.stroke();
  ctx.restore();
}
function labelTex(top, bot, aspect) {
  const hpx = 400, wpx = Math.round(hpx * aspect);
  const cv = document.createElement("canvas"); cv.width = wpx; cv.height = hpx;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#e7eaf6";
  if (top === HANGUP) drawHangup(ctx, wpx / 2, 86);
  else if (top) { ctx.font = "700 92px Nunito, Lato, sans-serif"; ctx.textAlign = "center"; ctx.fillText(top, wpx / 2, 124); }
  if (bot === "\u2756") { drawBerry(ctx, wpx / 2, 225); ctx.font = "700 62px Nunito, Lato, sans-serif"; ctx.textAlign = "center"; ctx.fillText("super", wpx / 2, 352); } // super key = BlackBerry logo
  else if (bot === "\u260E") drawSend(ctx, wpx / 2, 270); // send key = BB receiver
  else if (bot) { ctx.font = "800 128px Nunito, Lato, sans-serif"; ctx.textAlign = "center"; ctx.fillText(bot, wpx / 2, 340); }
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = 4;
  return t;
}
// BlackBerry 7-dot mark: 4 dots over 3, staggered
function drawBerry(ctx, cx, cy) {
  const r = 34, dx = 78, dy = 68;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    ctx.moveTo(cx + (i - 1.5) * dx + r, cy - dy / 2);
    ctx.arc(cx + (i - 1.5) * dx, cy - dy / 2, r, 0, Math.PI * 2);
  }
  for (let i = 0; i < 3; i++) {
    ctx.moveTo(cx + (i - 1) * dx + r, cy + dy / 2);
    ctx.arc(cx + (i - 1) * dx, cy + dy / 2, r, 0, Math.PI * 2);
  }
  ctx.fill();
}
const glyphs = {
  bspc: "\u2190", enter: "\u21B5", shift: "aA", dollar: "$",
  ctrl: "Ctrl", altw: "Alt", space: "space", layer1: "L1", layer2: "L2",
  capslock: "\u260E", super: "\u2756", esc: "Esc", tab: "Tab",
};

function makeCap(id, topTxt, botTxt, kw, kh) {
  const g = new THREE.Group();
  // BB-style: caps tile their slots; slim seams reveal the chrome fret below
  const bw = kw * 0.975, bh = kh * 0.975;
  const mat = new THREE.MeshStandardMaterial({
    color: 0x0b0e16, roughness: 0.24, metalness: 0.12,
    emissive: new THREE.Color(0xffb85c), emissiveIntensity: 0 });
  const top = new THREE.Mesh(capGeo(bw, bh, bw * 0.22), mat);
  let ftex;
  const aspect = (bw * 0.82) / (bh * 0.66);
  if (glyphs[id]) ftex = labelTex(topTxt, glyphs[id], aspect);
  else ftex = labelTex(topTxt, botTxt, aspect);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(bw * 0.82, bh * 0.66),
    new THREE.MeshBasicMaterial({ map: ftex, transparent: true, opacity: 0.95 }));
  face.position.z = DEPTH + BEVEL + 0.05;
  g.add(top, face);
  // halo ring behind the cap: the per-key press glow
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(bw * 2.0, bh * 2.0),
    new THREE.MeshBasicMaterial({ map: haloTex(), transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.position.z = 0.7;
  g.add(halo);
  keycaps[id] = { group: g, top, halo, baseY: 0 };
  return g;
}
let _haloTex = null;
function haloTex() {
  if (_haloTex) return _haloTex;
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 8, 64, 64, 64);
  g.addColorStop(0, "rgba(255,190,100,0.9)");
  g.addColorStop(0.45, "rgba(255,160,70,0.35)");
  g.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  _haloTex = new THREE.CanvasTexture(cv);
  return _haloTex;
}

let caseMesh = null, videoReady = false, mtex = null;
function orientAndBuild() {
  const geo = caseMesh.geometry;
  geo.computeBoundingBox();
  caseMesh.rotation.set(0, 0, 0);
  caseMesh.scale.setScalar(3.3);
  caseMesh.updateMatrixWorld(true);
  let bbw = new THREE.Box3().setFromObject(caseMesh);
  const cc = bbw.getCenter(new THREE.Vector3());
  caseMesh.position.set(-cc.x, -cc.y, -cc.z);
  caseMesh.updateMatrixWorld(true);
  bbw = new THREE.Box3().setFromObject(caseMesh);
  window.__bbw = bbw;

  const cw = bbw.max.x - bbw.min.x, chh = bbw.max.y - bbw.min.y;
  const zFace = bbw.max.z + 1.0;

  // media row: measured case holes, expanded slightly: x 0.186..0.813, y 0.300..0.364
  const mY0 = bbw.min.y + chh * 0.300, mY1 = bbw.min.y + chh * 0.364;
  const mH = mY1 - mY0, mY = (mY0 + mY1) / 2;
  const mX0 = bbw.min.x + cw * 0.186, mX1 = bbw.min.x + cw * 0.813;
  const slotw = (mX1 - mX0) / 5;
  const mkM = (id, si, top) => {
    const cap = makeCap(id, top || null, null, slotw, mH);
    cap.position.set(mX0 + slotw * (si + 0.5), mY, zFace);
    keycaps[id].baseY = mY;
    scene.add(cap);
  };
  mkM("capslock", 0); mkM("super", 1);
  // trackpad: chrome ring (BB style) with dark pad recessed inside
  const tpRing = new THREE.Mesh(new THREE.BoxGeometry(slotw * 0.99, mH * 0.99, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x9aa2b5, roughness: 0.3, metalness: 0.85 }));
  tpRing.position.set((mX0 + mX1) / 2, mY, zFace - 1.0);
  scene.add(tpRing);
  const tp = new THREE.Mesh(new THREE.BoxGeometry(slotw * 0.84, mH * 0.82, 2.4),
    new THREE.MeshStandardMaterial({ color: 0x0a0d15, roughness: 0.28, metalness: 0.42 }));
  tp.position.set((mX0 + mX1) / 2, mY, zFace - 0.5);
  scene.add(tp);
  mkM("esc", 3, "\u21A9"); mkM("tab", 4, HANGUP);

  // letter + bottom rows: measured case opening, expanded slightly: x 0.150..0.849, y 0.104..0.295
  const kbX0 = bbw.min.x + cw * 0.150, kbX1 = bbw.min.x + cw * 0.849;
  const kbY0 = bbw.min.y + chh * 0.104, kbY1 = bbw.min.y + chh * 0.295;
  const rowsL = [ROWS[1], ROWS[2], ROWS[3], ROWS[4]];
  const rowH = (kbY1 - kbY0) / rowsL.length;
  rowsL.forEach((row, ri) => {
    const y = kbY1 - rowH * (ri + 0.5);
    const kw = (kbX1 - kbX0) / row.ids.length;
    row.ids.forEach((p, i) => {
      const cap = makeCap(p[1], p[0], p[1], kw, rowH);
      cap.position.set(kbX0 + kw * (i + 0.5), y, zFace);
      keycaps[p[1]].baseY = y;
      scene.add(cap);
    });
  });

  // face depth for the key light
  window.__zFace = zFace;
  // dark membrane behind the keyboard cutouts so any peeks read as recess
  const mem = new THREE.Mesh(new THREE.PlaneGeometry(cw * 0.72, chh * 0.32),
    new THREE.MeshBasicMaterial({ color: 0x05070c }));
  mem.position.set(bbw.min.x + cw * 0.5, bbw.min.y + chh * 0.21, zFace - 8);
  scene.add(mem);
  // chrome fret plate behind the letter grid; seams between caps reveal it
  const fret = new THREE.Mesh(new THREE.PlaneGeometry(kbX1 - kbX0 + 4, kbY1 - kbY0 + 4),
    new THREE.MeshStandardMaterial({ color: 0x9aa2b5, roughness: 0.32, metalness: 0.85 }));
  fret.position.set((kbX0 + kbX1) / 2, (kbY0 + kbY1) / 2, zFace - 1.0);
  scene.add(fret);

  // screen plane fed by pre-decoded JPEG sequence (this Chromium decodes
  // <video> to black pixels for WebGL/canvas, verified via drawImage).
  // The muted video element is kept as the animation clock only.
  const vid = document.getElementById("vid");
  mtex = new THREE.Texture();
  mtex.encoding = THREE.sRGBEncoding;
  mtex.minFilter = THREE.LinearFilter;
  mtex.magFilter = THREE.LinearFilter;
  window.__frames = [];
  window.__FR = 8;
  for (let i = 1; i <= 275; i++) {
    const im = new Image();
    im.src = "/frames/f_" + String(i).padStart(3, "0") + ".jpg";
    window.__frames.push(im);
  }
  const sy0 = bbw.min.y + chh * 0.385, sy1 = bbw.min.y + chh * 0.985;
  const sx0 = bbw.min.x + cw * 0.032, sx1 = bbw.max.x - cw * 0.032;
  // black bezel fills the opening; video plane smaller inside it
  const bez = new THREE.Mesh(new THREE.PlaneGeometry(sx1 - sx0, sy1 - sy0),
    new THREE.MeshBasicMaterial({ color: 0x000000 }));
  bez.position.set((sx0 + sx1) / 2, (sy0 + sy1) / 2, zFace - 3.2);
  scene.add(bez);
  const sm = new THREE.Mesh(new THREE.PlaneGeometry((sx1 - sx0) * 0.86, (sy1 - sy0) * 0.86),
    new THREE.MeshBasicMaterial({ map: mtex }));
  sm.position.set((sx0 + sx1) / 2, (sy0 + sy1) / 2, zFace - 3.0);
  scene.add(sm);

  frameCam(bbw, 0.03);
  vid.addEventListener("loadeddata", () => { videoReady = true; });
  vid.load();
  window.__built = true;
}

Promise.all([loadSTL("/stl/q10_uppercase.stl"),
  document.fonts.load('800 100px Nunito'), document.fonts.load('700 100px Nunito')
]).then(([geo]) => {
  caseMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x0d1322, roughness: 0.66, metalness: 0.22 }));
  scene.add(caseMesh);
  orientAndBuild();
  window.__ready = true;
}).catch(e => { window.__err = String(e); });

function stateAt(t) {
  const st = {};
  for (const e of EVENTS) {
    if (t >= e.t && t <= e.t + e.dur) {
      const u = (t - e.t) / e.dur;
      const env = u < 0.15 ? u / 0.15 : Math.pow(1 - (u - 0.15) / 0.85, 1.2);
      for (const k of e.keys)
        st[k] = { glow: env, sink: u < 0.12 ? u / 0.12 : Math.max(0, (0.25 - u) / 0.13) };
    }
  }
  return st;
}

let recorder = null, chunks = [], recDone = null;
async function startRec() {
  const vid = document.getElementById("vid");
  vid.currentTime = 0;
  await vid.play();
  const stream = renderer.domElement.captureStream(30);
  recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9", videoBitsPerSecond: 12000000 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recDone = new Promise(res => { recorder.onstop = res; });
  recorder.start(200);
  window.__recording = true;
  return true;
}
async function stopRec() {
  recorder.stop();
  await recDone;
  window.__recording = false;
  return true;
}
function recInfo() {
  return JSON.stringify({ n: chunks.length, bytes: chunks.reduce((a, b) => a + b.size, 0), done: !window.__recording });
}
async function getRec() {
  const blob = new Blob(chunks, { type: "video/webm" });
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => resolve(btoa(String.fromCharCode.apply(null, new Uint8Array(fr.result))));
    fr.readAsArrayBuffer(blob);
  });
}

function loop() {
  if (window.__built) {
    const vid = document.getElementById("vid");
    const t = vid.currentTime || 0;
    const fi = Math.min(window.__frames.length - 1, Math.max(0, Math.floor(t * window.__FR)));
    const fim = window.__frames[fi];
    if (fim && fim.complete && fim.naturalWidth && mtex.image !== fim) { mtex.image = fim; mtex.needsUpdate = true; }
    const st = stateAt(t);
    let best = null, bestGlow = 0;
    for (const id in keycaps) {
      const k = keycaps[id], s = st[id];
      const gl = s ? s.glow : 0;
      k.top.material.emissiveIntensity = gl * 2.2;
      if (k.halo) k.halo.material.opacity = gl * 0.85;
      k.group.position.y = k.baseY - (s ? s.sink : 0) * 1.4;
      if (gl > bestGlow) { bestGlow = gl; best = k; }
    }
    // press light follows the active key instead of sitting in one place
    if (best && window.__zFace !== undefined) {
      spot.position.set(best.group.position.x, best.group.position.y, window.__zFace + 70);
      spot.intensity = bestGlow * 0.08;
    } else {
      spot.intensity = 0;
    }
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
</script>
