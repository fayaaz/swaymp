function parseSTL(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(80, true);
  const pos = [];
  for (let i = 0; i < n; i++) {
    const off = 84 + i * 50 + 12;
    for (let v = 0; v < 3; v++)
      pos.push(dv.getFloat32(off + v*12, true), dv.getFloat32(off + v*12+4, true), dv.getFloat32(off + v*12+8, true));
  }

  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
const loadSTL = (u) => fetch(u).then(r => r.arrayBuffer()).then(parseSTL);

const keycaps = {};
const capGeoCache = {};

  const shape = new THREE.Shape();
  const hw = bw / 2, hh = bh / 2;
  shape.moveTo(-hw + r, -hh);
  shape.lineTo(hw - r, -hh);
  shape.quadraticCurveTo(hw, -hh, hw, -hh + r);
  shape.lineTo(hw, hh - r);
  shape.quadraticCurveTo(hw, hh, hw - r, hh);
  shape.lineTo(-hw + r, hh);

  shape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);

  const cM = bM.getCenter(new THREE.Vector3());
  const cL = bL.getCenter(new THREE.Vector3());
  const tU = bU.max.z - bU.min.z, tM = bM.max.z - bM.min.z, tL = bL.max.z - bL.min.z;
  parts.upper.translate(-cU.x, -cU.y, -bU.max.z);
  parts.middle.translate(-cM.x, -cM.y, -(bM.max.z + tU));
  parts.lower.translate(-cL.x, -cL.y, -(bL.max.z + tU + tM));
  const upper = new THREE.Mesh(parts.upper, alu);
  const middle = new THREE.Mesh(parts.middle, matte);
  const lower = new THREE.Mesh(parts.lower, alu);
  upper.castShadow = true; upper.receiveShadow = true;
  middle.receiveShadow = true;
  device.add(upper, middle, lower);

  // red side switch on the right edge, mid-body (front view: a small sliver)
  parts.red.computeBoundingBox();
  const bR0 = parts.red.boundingBox.clone();
  const cR0 = bR0.getCenter(new THREE.Vector3());
  parts.red.translate(-cR0.x, -cR0.y, -cR0.z);
  parts.red.computeBoundingBox();
  const bR = parts.red.boundingBox.clone();
  const sR = bR.getSize(new THREE.Vector3());
  const maxD = Math.max(sR.x, sR.y, sR.z);
  const sw = new THREE.Mesh(parts.red, red);
  sw.scale.setScalar(7 / maxD);
  const half_w = 91.8 / 2;
  sw.position.set(half_w - 1.0, -18, -(tU + tM / 2));
  device.add(sw);

  device.scale.setScalar(S);
  scene.add(device);
  device.updateMatrixWorld(true);
  // Frame and lay out from the FRONT PLATE only: the side switch sticks out
  // to the right and would otherwise pull every fraction off the case
  // openings (screen/keys would sit visibly right of their cutouts).
  let bbw = new THREE.Box3().setFromObject(upper);
  const cc = bbw.getCenter(new THREE.Vector3());
  device.position.set(-cc.x, -cc.y, -cc.z);
  device.updateMatrixWorld(true);
  bbw = new THREE.Box3().setFromObject(upper);
  window.__bbw = bbw;

  const cw = bbw.max.x - bbw.min.x, chh = bbw.max.y - bbw.min.y;
  const zFace = bbw.max.z + 1.0;

  // full body extends ~12.6 STL units (~42 scene units) behind the front
  // plate: middle + lower case. Keep the blob behind all of it.
  addShadowBlob(cw, chh, bbw.min.z - 42);

  // ---- front screws: M2 countersunk look (dark alu head + hex socket) ----
  // bottom pair flanking the keyboard, mid pair flanking the media row
  const screwPos = [[0.085, 0.055], [0.915, 0.055], [0.085, 0.335], [0.915, 0.335]];
  const headMat = new THREE.MeshStandardMaterial({
    color: 0x9aa0b0, roughness: 0.3, metalness: 1.0, envMapIntensity: 1.1 });
  const sockMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.5, metalness: 0.7 });
  for (const [fx, fy] of screwPos) {
    const sg = new THREE.Group();
    const head = new THREE.Mesh(new THREE.CylinderGeometry(6.0, 6.8, 2.4, 28), headMat);
    head.rotation.x = Math.PI / 2;
    const sock = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 2.9, 1.2, 6), sockMat);
    sock.rotation.x = Math.PI / 2;
    sock.position.z = 1.0;
    head.castShadow = true;
    sg.add(head, sock);
    sg.position.set(bbw.min.x + cw * fx, bbw.min.y + chh * fy, zFace - 0.6);
    scene.add(sg);
  }

  // ---- media row: red ring / green triangle / trackpad / magenta X / lime ----
  const mY0 = bbw.min.y + chh * 0.300, mY1 = bbw.min.y + chh * 0.364;
  const mH = mY1 - mY0, mY = (mY0 + mY1) / 2;
  const mX0 = bbw.min.x + cw * 0.186, mX1 = bbw.min.x + cw * 0.813;
  const slotw = (mX1 - mX0) / 5;
  // dark key wells so the islands read as separate keys
  const wellMat = new THREE.MeshStandardMaterial({ color: 0x05070c, roughness: 0.7, metalness: 0.2 });
  const mkM = (id, si) => {
    const cx = mX0 + slotw * (si + 0.5);
    const well = new THREE.Mesh(new THREE.PlaneGeometry(slotw * 0.98, mH * 1.25), wellMat);
    well.position.set(cx, mY, zFace - 0.9);
    scene.add(well);
    const cap = makeCap(id, null, null, slotw, mH, { fill: 0.88, fillY: 0.94, r: Math.min(slotw, mH) * 0.14 });
    cap.position.set(cx, mY, zFace);
    keycaps[id].baseY = mY;
    scene.add(cap);
  };
  mkM("capslock", 0); mkM("super", 1);
  // trackpad: dark pad + white LED ring (BB style), ring gently lit
  const tpX = mX0 + slotw * 2.5;
  const tpWell = new THREE.Mesh(new THREE.PlaneGeometry(slotw * 0.98, mH * 1.25), wellMat);
  tpWell.position.set(tpX, mY, zFace - 0.9);
  scene.add(tpWell);
  const tp = new THREE.Mesh(capGeo(slotw * 0.74, mH * 0.8, slotw * 0.18),
    new THREE.MeshPhysicalMaterial({ color: 0x080a10, roughness: 0.22, metalness: 0.35,
      clearcoat: 1.0, clearcoatRoughness: 0.12, envMapIntensity: 0.8 }));
  tp.position.set(tpX, mY, zFace - 0.4);
  scene.add(tp);
  trackRing = new THREE.Mesh(new THREE.PlaneGeometry(slotw * 0.98, mH * 1.04),
    new THREE.MeshBasicMaterial({ map: ringTex(), transparent: true, opacity: 0.92,
      blending: THREE.AdditiveBlending, depthWrite: false }));
  trackRing.position.set(tpX, mY, zFace + DEPTH + 0.6);
  scene.add(trackRing);
  mkM("esc", 3); mkM("tab", 4);

  // ---- letter + bottom rows between raised chrome frets (BB style) ----
  const kbX0 = bbw.min.x + cw * 0.150, kbX1 = bbw.min.x + cw * 0.849;
  const kbY0 = bbw.min.y + chh * 0.104, kbY1 = bbw.min.y + chh * 0.295;
  const rowsL = [ROWS[1], ROWS[2], ROWS[3], ROWS[4]];
  const rowH = (kbY1 - kbY0) / rowsL.length;
  const fretMat = new THREE.MeshStandardMaterial({
    color: 0xb9bfcc, roughness: 0.27, metalness: 1.0, envMapIntensity: 0.9 });
  for (let r = 0; r <= rowsL.length; r++) {
    const fy = kbY1 - rowH * r;
    const rail = new THREE.Mesh(new THREE.BoxGeometry(kbX1 - kbX0 + 5, 2.0, 1.6), fretMat);
    rail.position.set((kbX0 + kbX1) / 2, fy, zFace - 0.5);
    scene.add(rail);
  }
  // dark membrane behind the keyboard cutouts so any peeks read as recess
  const mem = new THREE.Mesh(new THREE.PlaneGeometry(kbX1 - kbX0 + 4, kbY1 - kbY0 + 4),
    new THREE.MeshBasicMaterial({ color: 0x04060a }));
  mem.position.set((kbX0 + kbX1) / 2, (kbY0 + kbY1) / 2, zFace - 7);
  scene.add(mem);
  rowsL.forEach((row, ri) => {
    const y = kbY1 - rowH * (ri + 0.5);
    const units = row.ids.reduce((a, p) => a + (p[2] || 1), 0);
    const uw = (kbX1 - kbX0) / units;
    let x = kbX0;
    row.ids.forEach((p) => {
      const kw = uw * (p[2] || 1);
      const cap = makeCap(p[1], p[0], p[1], kw, rowH, { fill: 0.96, fillY: 0.80 });
      cap.position.set(x + kw / 2, y, zFace);
      keycaps[p[1]].baseY = y;
      scene.add(cap);
      x += kw;
    });
  });

  // ---- screen: black glass bezel, video plane, glass + traveling streak ----
  window.__FR = 12;
  window.__frames = [];
  window.__framesLoaded = false;
  function loadFrames(n) {
    if (window.__framesLoaded) return;
    window.__framesLoaded = true;
    for (let i = 1; i <= n; i++) {
      const im = new Image();
      im.src = "/frames/f_" + String(i).padStart(3, "0") + ".jpg";
      window.__frames.push(im);
    }
  }
  const vid = document.getElementById("vid");
  vid.addEventListener("loadedmetadata", () => {
    const d = isFinite(vid.duration) && vid.duration > 1 ? vid.duration : 45;
    loadFrames(Math.ceil(d * window.__FR));
  }, { once: true });
  setTimeout(() => loadFrames(520), 4000);
  const screenCanvas = document.createElement("canvas");
  screenCanvas.width = 720;
  screenCanvas.height = 720;
  const screenCtx = screenCanvas.getContext("2d");
  window.__screenCanvas = screenCanvas;
  window.__screenCtx = screenCtx;
  window.__lastFrameIndex = -1;
  window.__lastSensitive = false;
  mtex = new THREE.CanvasTexture(screenCanvas);
  if (mtex.colorSpace !== undefined && THREE.SRGBColorSpace !== undefined)
    mtex.colorSpace = THREE.SRGBColorSpace;
  else if (mtex.encoding !== undefined && THREE.sRGBEncoding !== undefined)
    mtex.encoding = THREE.sRGBEncoding;
  mtex.minFilter = THREE.LinearFilter;
  mtex.magFilter = THREE.LinearFilter;
  mtex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  mtex.needsUpdate = true;

  const sy0 = bbw.min.y + chh * 0.385, sy1 = bbw.min.y + chh * 0.985;
  const sx0 = bbw.min.x + cw * 0.032, sx1 = bbw.max.x - cw * 0.032;
  const scrW = sx1 - sx0, scrH = sy1 - sy0;
  const scrCx = (sx0 + sx1) / 2, scrCy = (sy0 + sy1) / 2;
  const vw = scrW * 0.93, vh = scrH * 0.93;
  // glossy black bezel with rounded opening (video shows through the hole)
  const bezShape = roundedRectShape(scrW, scrH, 20);
  bezShape.holes.push((function () {
    const hole = new THREE.Path();
    const hw = vw / 2, hh = vh / 2, r = 12;
    hole.moveTo(-hw + r, -hh);
    hole.lineTo(hw - r, -hh); hole.quadraticCurveTo(hw, -hh, hw, -hh + r);
    hole.lineTo(hw, hh - r); hole.quadraticCurveTo(hw, hh, hw - r, hh);
    hole.lineTo(-hw + r, hh); hole.quadraticCurveTo(-hw, hh, -hw, hh - r);
    hole.lineTo(-hw, -hh + r); hole.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
    return hole;
  })());
  const bez = new THREE.Mesh(new THREE.ShapeGeometry(bezShape, 24),
    new THREE.MeshPhysicalMaterial({ color: 0x030407, roughness: 0.12, metalness: 0.5,
      clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.0 }));
  bez.position.set(scrCx, scrCy, zFace - 2.4);
  scene.add(bez);
  // back the opening with black so unloaded frames read as off-glass
  const scrBack = new THREE.Mesh(new THREE.PlaneGeometry(vw, vh),
    new THREE.MeshBasicMaterial({ color: 0x000000 }));
  scrBack.position.set(scrCx, scrCy, zFace - 2.2);
  scene.add(scrBack);
  const sm = new THREE.Mesh(new THREE.PlaneGeometry(vw, vh),
    new THREE.MeshBasicMaterial({ map: mtex, toneMapped: true }));
  sm.position.set(scrCx, scrCy, zFace - 2.0);
  scene.add(sm);
  // cover glass: faint clearcoat sheet over the video
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(vw + 6, vh + 6),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.07,
      roughness: 0.05, metalness: 0.0, envMapIntensity: 1.0, depthWrite: false }));
  glass.position.set(scrCx, scrCy, zFace - 1.2);
  scene.add(glass);
  // diagonal specular streak drifting with the camera sway
  const streakCv = document.createElement("canvas");
  streakCv.width = 256; streakCv.height = 256;
  (function () {
    const ctx = streakCv.getContext("2d");
    const g = ctx.createLinearGradient(0, 0, 256, 0);
    g.addColorStop(0.30, "rgba(255,255,255,0)");
    g.addColorStop(0.47, "rgba(255,255,255,0.55)");
    g.addColorStop(0.55, "rgba(255,255,255,0.55)");
    g.addColorStop(0.72, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  })();
  glassStreak = new THREE.Mesh(new THREE.PlaneGeometry(vw * 1.4, vh * 1.4),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(streakCv), transparent: true,
      opacity: 0.10, blending: THREE.AdditiveBlending, depthWrite: false }));
  glassStreak.rotation.z = -0.5;
  glassStreak.position.set(scrCx, scrCy, zFace - 1.0);
  scene.add(glassStreak);

  // face depth for the key light
  window.__zFace = zFace;

  frameCam(bbw, 0.03);
  // widen shadow frustum to the final device size
  keyL.target.position.set(0, (bbw.min.y + bbw.max.y) / 2, 0);
  scene.add(keyL.target);
  vid.addEventListener("loadeddata", () => { window.__videoReady = true; });
  vid.load();
  window.__built = true;
}

Promise.all([loadSTL("/stl/q10_uppercase.stl"), loadSTL("/stl/hackberry_middle.stl"),
  loadSTL("/stl/hackberry_lower.stl"), loadSTL("/stl/hackberry_redswitch.stl"),
  document.fonts.load('800 100px Nunito'), document.fonts.load('700 100px Nunito'),
  document.fonts.load('700 100px BBKey'), document.fonts.load('400 100px BBKey')
]).then(([upper, middle, lower, redswitch]) => {
  orientAndBuild({ upper, middle, lower, red: redswitch });
  window.__ready = true;
}).catch(e => { window.__err = String(e); });

function stateAt(t) {
  const st = {};
  for (const e of EVENTS) {
    if (t >= e.t && t <= e.t + e.dur) {
      const u = (t - e.t) / e.dur;
      const env = u < 0.15 ? u / 0.15 : Math.pow(1 - (u - 0.15) / 0.85, 1.2);
      for (const k of e.keys)
        st[k] = { glow: env, sink: u < 0.12 ? u / 0.12 : Math.max(0, (0.25 - u) / 0.13) };
    }
  }
  return st;
}

let recorder = null, chunks = [], recDone = null;
async function startRec() {
  const vid = document.getElementById("vid");
  vid.currentTime = 0;
  await vid.play();
  const stream = renderer.domElement.captureStream(30);
  recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9", videoBitsPerSecond: 12000000 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recDone = new Promise(res => { recorder.onstop = res; });
  recorder.start(200);
  window.__recording = true;
  return true;
}
async function stopRec() {
  recorder.stop();
  await recDone;
  window.__recording = false;
  return true;
}
function recInfo() {
  return JSON.stringify({ n: chunks.length, bytes: chunks.reduce((a, b) => a + b.size, 0), done: !window.__recording });
}
async function getRec() {
  const blob = new Blob(chunks, { type: "video/webm" });
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => resolve(btoa(String.fromCharCode.apply(null, new Uint8Array(fr.result))));
    fr.readAsArrayBuffer(blob);
  });
}

const pressLight = new THREE.PointLight(0xffb85c, 0, 700, 1.6);
scene.add(pressLight);
let lastNow = null;
function loop() {
  if (window.__built) {
    const now = performance.now();
    let t;
    if (window.__recording) {
      if (lastNow === null) lastNow = now;
      t = (now - (window.__recStart || now)) / 1000;
      lastNow = now;
    } else {
      const vid = document.getElementById("vid");
      t = vid.currentTime || 0;
    }
    const fi = Math.min(window.__frames.length - 1, Math.max(0, Math.floor(t * window.__FR)));
    const fim = window.__frames[fi];
    const sens = sensitiveAt(t);
    if (fim && fim.complete && fim.naturalWidth &&
        (fi !== window.__lastFrameIndex || sens !== window.__lastSensitive)) {
      const ctx = window.__screenCtx;
      ctx.save();
      ctx.filter = sens ? "blur(32px)" : "none";
      ctx.drawImage(fim, 0, 0, 720, 720);
      ctx.restore();
      mtex.needsUpdate = true;
      window.__lastFrameIndex = fi;
      window.__lastSensitive = sens;
    }
    const st = stateAt(t);
    let best = null, bestGlow = 0;
    for (const id in keycaps) {
      const k = keycaps[id], s = st[id];
      const gl = s ? s.glow : 0;
      // restrained backlight: legends stay readable, halo carries the glow
      k.top.material.emissiveIntensity = gl * 0.7;
      if (k.halo) k.halo.material.opacity = gl * 0.55;
      k.group.position.y = k.baseY - (s ? s.sink : 0) * 1.6;
      if (gl > bestGlow) { bestGlow = gl; best = k; }
    }
    // press light follows the active key, tinted to match it
    if (best && window.__zFace !== undefined) {
      pressLight.color.setHex(best.glowHex);
      pressLight.position.set(best.group.position.x, best.group.position.y, window.__zFace + 90);
      pressLight.intensity = bestGlow * 6;
    } else {
      pressLight.intensity = 0;
    }
    // trackpad ring breathes gently
    if (trackRing) trackRing.material.opacity = 0.85 + 0.1 * Math.sin(t * 2.2);
    // cinematic drift: slow push-in + lateral sway, glass streak follows
    if (camBase) {
      const push = 1 - 0.035 * (t < 6 ? (1 - Math.cos(Math.PI * t / 6)) / 2 : 1);
      const sx = 12 * Math.sin(t * 0.12), sy = 8 * Math.sin(t * 0.09 + 1);
      cam.position.set(sx, camBase.cy + sy, camBase.dist * push);
      cam.lookAt(0, camBase.cy, 0);
      if (glassStreak) glassStreak.position.x += 0; // streak static on glass
    }
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
</script>
