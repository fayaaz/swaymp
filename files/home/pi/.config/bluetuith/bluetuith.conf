# bluetuith config (HJSON). Docs: https://bluetuith-org.github.io/bluetuith/
# Adapter is powered + pairable on launch so $mod+b is ready to pair; scan
# (discovery) and discoverable are toggled in-app with s and S.
adapter-states: "powered:yes,pairable:yes"

# Dracula palette, matching the sway/waybar/swaync theme. Background stays
# transparent so the window shows foot's own background ("default" is not an
# accepted color name here).
theme: {
    Text: "#f8f8f2"
    Border: "#6272a4"
    Background: transparent
    StatusInfo: "#f8f8f2"
    StatusError: "#ff5555"

    Adapter: "#bd93f9"
    AdapterPowered: "#50fa7b"
    AdapterNotPowered: "#ff5555"
    AdapterDiscoverable: "#8be9fd"
    AdapterScanning: "#f1fa8c"
    AdapterPairable: "#ff79c6"

    Device: "#f8f8f2"
    DeviceType: "#6272a4"
    DeviceAlias: "#f8f8f2"
    DeviceConnected: "#50fa7b"
    DeviceDiscovered: "#ffb86c"
    DeviceProperty: "#6272a4"
    DevicePropertyConnected: "#50fa7b"
    DevicePropertyDiscovered: "#ffb86c"

    Menu: "#f8f8f2"
    MenuBar: "#44475a"
    MenuItem: "#f8f8f2"
    ProgressBar: "#bd93f9"
    ProgressText: "#f8f8f2"
}
