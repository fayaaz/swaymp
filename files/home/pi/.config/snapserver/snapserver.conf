# Snapcast server (multiroom broadcast), payload-owned.
#
# Started on demand by ~/.config/sway/audio-mode.sh (Broadcast/Group) and
# stopped again in Receiver mode; the user unit is deliberately never enabled
# at boot, so the Pi neither advertises _snapcast._tcp nor holds 1704/1780
# when it is not sending.
#
# The source is MPD's fifo output "Multiroom" (see ~/.config/mpd/mpd.conf):
#   type "fifo", path "/tmp/snapfifo", format "48000:16:2"
# Snapserver creates /tmp/snapfifo if missing (same user as MPD) and consumes
# raw PCM. The sample format must match MPD's exactly, or audio is silence or
# garbage (MPD resamples 44.1 kHz sources to 48 kHz).
[server]
threads = -1

[http]
# Serve snapweb (the phone UI) from the distro path. Without this the compiled
# default is empty and :1780 serves snapserver's built-in placeholder page.
doc_root = /usr/share/snapserver/snapweb

[stream]
source = pipe:///tmp/snapfifo?name=Multiroom&sampleformat=48000:16:2&codec=pcm&chunk_ms=20
# Tune 80-300: lower is lower latency, higher survives WiFi jitter.
# Keep >= ~4 * chunk_ms. FLAC (+~26 ms) if ~1.5 Mbit/s PCM per client is a
# problem on the LAN.
buffer = 150
